name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox xvfb curl wget tar

      - name: Install geckodriver
        run: |
          # download latest geckodriver release for linux64 from GitHub releases
          GECKO_URL=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest \
            | grep browser_download_url | grep linux64.tar.gz | cut -d '"' -f 4)
          curl -L "$GECKO_URL" -o geckodriver.tar.gz
          tar -xzf geckodriver.tar.gz
          sudo mv geckodriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/geckodriver

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run Django unit tests
        run: python manage.py test --verbosity=2

      - name: Run functional tests (Selenium)
        env:
          MOZ_HEADLESS: '1'
        run: xvfb-run -a python functional_tests.py -v
